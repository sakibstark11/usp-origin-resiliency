services:
  contribution:
    image: jrottenberg/ffmpeg:7.1-alpine
    command:
      [
        "-re",
        "-f",
        "lavfi",
        "-i",
        "testsrc=size=640X480:rate=25",
        "-f",
        "lavfi",
        "-i",
        "sine=frequency=1000:sample_rate=48000",
        "-map",
        "0:v:0",
        "-map",
        "1:a:0",
        "-c:v",
        "libx264",
        "-preset",
        "veryfast",
        "-g",
        "50",
        "-keyint_min",
        "50",
        "-sc_threshold",
        "0",
        "-c:a",
        "aac",
        "-f",
        "tee",
        "[f=mpegts:onfail=ignore]udp://encoder-a:1234?pkt_size=1316|[f=mpegts:onfail=ignore]udp://encoder-b:1234?pkt_size=1316",
      ]
    restart: unless-stopped
    depends_on: [encoder-a, encoder-b]

  encoder-a:
    build: ./encoder
    environment:
      - TZ=UTC
      - TEXT=ENCODER A
    restart: unless-stopped
  encoder-b:
    build: ./encoder
    environment:
      - TZ=UTC
      - TEXT=ENCODER B
    restart: unless-stopped

  gateway:
    build:
      context: ./gateway
    ports: ["8080:80"]
    volumes:
      - ./web:/usr/local/openresty/nginx/html:ro
    depends_on: [encoder-a, encoder-b]
    restart: unless-stopped

volumes:
  origin-a:
  origin-b:

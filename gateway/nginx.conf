worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    resolver      127.0.0.11 valid=5s;

    lua_shared_dict override 1m;

    upstream origin_cluster_a {
        server encoder-a max_fails=1 fail_timeout=3s;
        server encoder-b max_fails=1 fail_timeout=3s backup;
    }

    upstream origin_cluster_b {
        server encoder-b max_fails=1 fail_timeout=3s;
        server encoder-a max_fails=1 fail_timeout=3s backup;
    }

    server {
        listen 80;
        root /usr/local/openresty/nginx/html;
        index index.html;

        # ------------------------------------------------------------
        # Admin endpoint: /switch?origin=a|b|clear
        # ------------------------------------------------------------
        location = /switch {
            default_type text/plain;
            add_header Cache-Control "no-store";
            content_by_lua_file /etc/nginx/lua/switch.lua;
        }

        # ------------------------------------------------------------
        # /live/... — instant native failover via Upstream pools
        # ------------------------------------------------------------
        location /live/ {
            set $backend "origin_cluster_a";
            access_by_lua_file /etc/nginx/lua/select_origin.lua;

            proxy_connect_timeout 1s;
            proxy_send_timeout 1s;
            proxy_read_timeout 1s;

            rewrite ^/live/(.*)$ /$1 break;
            proxy_pass http://$backend;
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            add_header Cache-Control "no-cache";
        }

        # ------------------------------------------------------------
        # Direct-origin debug access (used by the A/B buttons)
        # ------------------------------------------------------------
        location /a/ {
            rewrite ^/a/(.*)$ /$1 break;
            proxy_pass http://encoder-a;
            add_header Cache-Control "no-cache";
        }

        location /b/ {
            rewrite ^/b/(.*)$ /$1 break;
            proxy_pass http://encoder-b;
            add_header Cache-Control "no-cache";
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}

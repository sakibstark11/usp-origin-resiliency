worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    types {
        application/vnd.apple.mpegurl m3u8;
        video/mp4                     mp4 m4s;
    }

    server {
        listen 80;
        root /usr/local/openresty/nginx/html;

        location / {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }
    }
}
